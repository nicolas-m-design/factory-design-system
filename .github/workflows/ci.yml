name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Detect test script
        id: test-script
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); console.log(pkg.scripts && pkg.scripts.test ? "present=true" : "present=false")' >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.test-script.outputs.present == 'true'
        run: npm run test
